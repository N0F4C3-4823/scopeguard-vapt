name: ScopeGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .
      - name: Install scanner parsers used by fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes nmap dnsutils zstd openssh-server
          sudo ssh-keygen -A
      - name: Python compile and lint
        run: |
          python -m compileall -q app tests
          ruff check app tests
      - name: Frontend syntax
        run: node --check static/app.js
      - name: Installer syntax
        run: bash -n install.sh start.sh tools/playwright-mcp-nonroot.sh
      - name: Run controlled regression suite
        # Some controlled-service fixtures intentionally bind privileged ports.
        # The ephemeral GitHub runner is disposable; run only this local test
        # process with sudo so those fixtures execute instead of being skipped
        # or failing for the runner's unprivileged user.
        run: sudo -E "$(command -v python)" -m pytest -q
      - name: Secret hygiene
        shell: bash
        run: |
          if git grep -nE '(^|[^A-Za-z])(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)' -- . ':!docs/RELEASE_CHECKLIST.md'; then
            echo "Potential credential material found in tracked files." >&2
            exit 1
          fi
      - name: Verify clean source has no runtime data
        run: |
          test ! -e data/scopeguard.sqlite3
          test ! -d data/assessments
          test ! -d .venv
